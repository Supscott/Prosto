name: Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run Test Suite
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate Android apksigner
        run: |
          APKSIGNER_BIN=$(find "${ANDROID_HOME}/build-tools" -name apksigner \
            | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_BIN" ]; then
            echo "Error: apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER_BIN"
          echo "APKSIGNER_BIN=${APKSIGNER_BIN}" >> $GITHUB_ENV

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found raw APK: $RAW_APK"

          TAG_NAME="${{ github.ref_name }}"
          RELEASE_APK="prosto.apk"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured."
            echo "::error::Refusing to sign with a throwaway key."
            echo "::error::Every release must use the same key, otherwise"
            echo "::error::Android refuses the in-place update and the"
            echo "::error::in-app self-update breaks for every user."
            exit 1
          fi

          echo "Signing with repository secret keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          "$APKSIGNER_BIN" sign --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RELEASE_APK" \
            "$RAW_APK"
          rm -f release.jks

          echo "Verifying APK signature..."
          "$APKSIGNER_BIN" verify --verbose "$RELEASE_APK"

          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum "$RELEASE_APK" > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ env.RELEASE_APK }}
            checksums.txt
